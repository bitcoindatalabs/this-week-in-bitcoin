<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This Week in Bitcoin</title>

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="This Week in Bitcoin">
    <meta property="og:description"
        content="A weekly digest of the latest merged PRs, discussions, and updates in Bitcoin development.">
    <meta property="og:image" content="https://twib.bitcoindatalabs.org/images/og-image.png">
    <meta property="og:url" content="https://twib.bitcoindatalabs.org/">
    <meta property="og:type" content="website">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="This Week in Bitcoin">
    <meta name="twitter:description"
        content="A weekly digest of the latest merged PRs, discussions, and updates in Bitcoin development.">
    <meta name="twitter:image" content="https://twib.bitcoindatalabs.org/images/og-image.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;0,6..72,800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Bitcoin Data Labs Shell Styles -->
    <link rel="stylesheet" href="https://bitcoindatalabs.org/styles/styles.css">

    <!-- Modularized Local Styles -->
    <link rel="stylesheet" href="styles/style.css">
    <style>
        .pr-item.has-tech {
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s ease;
        }

        .pr-item.has-tech:hover {
            background-color: rgba(0, 0, 0, 0.02);
        }

        .expand-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #888;
            font-size: 0.8em;
            transition: transform 0.2s ease;
        }

        .pr-item.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .pr-technical-summary {
            display: none;
            margin-top: 15px;
            padding: 15px 20px;
            background-color: rgba(0, 0, 0, 0.02);
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
            background-size: 20px 20px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 6px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.85em;
            color: #333;
            line-height: 1.6;
        }

        html[data-theme="dark"] .pr-item.has-tech:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        html[data-theme="dark"] .pr-technical-summary {
            background-color: rgba(255, 255, 255, 0.02);
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #bbb;
        }

        .pr-item.expanded .pr-technical-summary {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="has-fixed-header">

    <!-- Bitcoin Data Labs Header -->
    <div id="header"></div>

    <div class="container">
        <div class="utility-bar">
            <span class="utility-left">Weekly Digest</span>
            <span id="header-date" class="utility-center">Loading...</span>
            <span class="utility-archive">
                <select id="archive-select-dropdown" onchange="fetchNewsletter(this.value)">
                    <option value="data/latest.json">Latest Edition</option>
                </select>
            </span>
        </div>

        <header>
            <h1>This Week in Bitcoin</h1>
        </header>

        <main id="content">
            <p style="text-align: center; font-family: var(--font-sans);">Loading the latest edition...</p>
        </main>


    </div>

    <!-- Bitcoin Data Labs Footer -->
    <div id="footer"></div>

    <!-- Bitcoin Data Labs App Components -->
    <script src="https://bitcoindatalabs.org/components/app-components.js"></script>
    <script src="js/app-config.js"></script>
    <script>
        // Ensure trailing slash on directory URL so relative links (meetings.html) resolve properly
        if (!window.location.pathname.endsWith('/') && !window.location.pathname.endsWith('.html')) {
            window.history.replaceState(null, '', window.location.pathname + '/' + window.location.search);
        }
        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const DATA_BASE = isLocal
            ? '../../orange-dev-data/output/twib/data/'
            : 'https://raw.githubusercontent.com/bitcoindatalabs/orange-dev-data/main/output/twib/data/';

        async function loadArchiveIndex() {
            try {
                const response = await fetch(DATA_BASE + 'archive_index.json');
                if (response.ok) {
                    const archives = await response.json();
                    const select = document.getElementById('archive-select-dropdown');

                    // Clear existing options except latest
                    select.innerHTML = '<option value="' + DATA_BASE + 'latest.json">Latest Edition</option>';

                    archives.forEach(item => {
                        const option = document.createElement('option');
                        option.value = DATA_BASE + item.file;
                        option.textContent = item.date;
                        select.appendChild(option);
                    });
                }
            } catch (e) {
                console.warn('No archive index found yet.');
            }
        }

        async function fetchNewsletter(url) {
            if (!url) url = DATA_BASE + 'latest.json';
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Could not fetch data');
                const data = await response.json();
                renderNewsletter(data);
            } catch (error) {
                document.getElementById('content').innerHTML = `<p style="text-align: center; color: var(--accent-color);">Failed to load newsletter data. Error: ${error.message}</p>`;
            }
        }

        function formatUser(userObj, source = null) {
            if (typeof userObj === 'string') {
                if (source === 'delving' || source === 'delving bitcoin') {
                    return `<a href="https://delvingbitcoin.org/u/${userObj}" target="_blank">@${userObj}</a>`;
                }
                if (source === 'mailing list' || source === 'mailing_list') {
                    return `@${userObj}`;
                }
                return `<a href="https://github.com/${userObj}" target="_blank">@${userObj}</a>`;
            }
            const username = userObj.username;
            const uuid = userObj.uuid;
            if (uuid) {
                return `<a href="https://network.bitcoindatalabs.org/profile.html?uuid=${uuid}" target="_blank">@${username}</a>`;
            }
            if (source === 'delving' || source === 'delving bitcoin') {
                return `<a href="https://delvingbitcoin.org/u/${username}" target="_blank">@${username}</a>`;
            }
            if (source === 'mailing list' || source === 'mailing_list') {
                return `@${username}`;
            }
            return `<a href="https://github.com/${username}" target="_blank">@${username}</a>`;
        }

        function togglePrs() {
            const btn = document.getElementById('toggle-prs-btn');
            const isHidden = document.querySelector('.hidden-pr').style.display === 'none';

            document.querySelectorAll('.hidden-pr').forEach(el => el.style.display = isHidden ? 'block' : 'none');
            document.querySelectorAll('.hidden-category').forEach(el => el.style.display = isHidden ? 'block' : 'none');

            btn.innerText = isHidden ? 'Show Less' : `Show ${btn.dataset.count} More PRs`;
        }

        function filterMergedCategory(catName, btnEl) {
            const container = document.getElementById('merged-category-filters');
            if (container) {
                container.querySelectorAll('.filter-pill').forEach(el => el.classList.remove('active'));
            }
            if (btnEl) btnEl.classList.add('active');

            const items = document.querySelectorAll('.merged-pr-item');
            const toggleBtnContainer = document.getElementById('toggle-prs-container');

            if (catName === 'all') {
                let count = 0;
                items.forEach(item => {
                    if (count < 10) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                    count++;
                });
                if (toggleBtnContainer) toggleBtnContainer.style.display = 'block';
            } else {
                items.forEach(item => {
                    const itemCat = item.getAttribute('data-category');
                    if (itemCat === catName || (itemCat && itemCat.includes(catName))) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
                if (toggleBtnContainer) toggleBtnContainer.style.display = 'none';
            }
        }

        function formatSectionHeader(text) {
            // Strip emojis from the text
            const cleanText = text.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '').trim();

            // Map text to FontAwesome icons
            let iconClass = 'fa-solid fa-hashtag'; // default
            const lowerText = cleanText.toLowerCase();

            if (lowerText.includes('build') || lowerText.includes('testing')) iconClass = 'fa-solid fa-screwdriver-wrench';
            else if (lowerText.includes('p2p') || lowerText.includes('network')) iconClass = 'fa-solid fa-bolt';
            else if (lowerText.includes('gui')) iconClass = 'fa-solid fa-desktop';
            else if (lowerText.includes('consensus') || lowerText.includes('crypto')) iconClass = 'fa-solid fa-shield-halved';
            else if (lowerText.includes('misc') || lowerText.includes('other')) iconClass = 'fa-solid fa-layer-group';
            else if (lowerText.includes('first-time')) iconClass = 'fa-solid fa-user-plus';
            else if (lowerText.includes('authors')) iconClass = 'fa-solid fa-medal';
            else if (lowerText.includes('reviewers')) iconClass = 'fa-solid fa-trophy';

            return `<i class="${iconClass} header-icon"></i> ${cleanText}`;
        }

        function renderNewsletter(data) {
            currentMeetingData = data;
            const content = document.getElementById('content');
            document.getElementById('header-date').textContent = `${data.start_date} — ${data.end_date}`;

            let html = `
                <div class="pulse-bar">
                    <div class="pulse-stat">
                        <span class="pulse-number">${data.stats.total_merged}</span>
                        <span class="pulse-label">Merged PRs</span>
                    </div>
                    <div class="pulse-stat">
                        <span class="pulse-number">${data.stats.total_reviews}</span>
                        <span class="pulse-label">Review Comments</span>
                    </div>
                    <div class="pulse-stat">
                        <span class="pulse-number">${data.stats.new_contributors}</span>
                        <span class="pulse-label">New Contributors</span>
                    </div>
                    <div class="pulse-stat">
                        <span class="pulse-number">${data.stats.total_threads}</span>
                        <span class="pulse-label">Active Threads</span>
                    </div>
                </div>
            `;

            // 1. TL;DR
            if (data.tldr && data.tldr.length > 0) {
                html += `<h2>The TL;DR</h2><ul class="tldr-list">`;
                data.tldr.forEach((point, index) => {
                    let cleanPoint = point.replace(/^[\*\-\•]+\s*/, '').replace(/^\d+\.\s*/, '').trim();
                    cleanPoint = cleanPoint.replace(/\*\*/g, '');

                    if (index === 0) {
                        const firstChar = cleanPoint.charAt(0);
                        const restOfPoint = cleanPoint.slice(1);
                        html += `<li><span class="drop-cap">${firstChar}</span>${restOfPoint}</li>`;
                    } else {
                        html += `<li>${cleanPoint}</li>`;
                    }
                });
                html += `</ul>`;
            }

            // 2. Dev Meeting
            if (data.meeting) {
                html += `<h2>🗓️ Weekly Core Meeting</h2>`;
                html += `
                    <div class="meeting-summary-card">
                        <div class="pr-meta" style="margin-bottom: 10px;">
                            <strong>#bitcoin-core-dev IRC Meeting</strong> · ${data.meeting.date} · ${data.meeting.participant_count || '?'} participants
                        </div>
                        <div class="pr-summary" style="margin-top: 10px; color: var(--text-color);">
                            <ul style="margin-top: 0; padding-left: 20px;">
                                ${(data.meeting.topics_discussed || []).map(t => `<li style="margin-bottom: 6px;">${t}</li>`).join('')}
                            </ul>
                            ${(data.meeting.action_items && data.meeting.action_items.length > 0) ? `
                                <div class="action-items-box" style="margin-top: 1rem;">
                                    <strong style="color: var(--accent-color-text); font-family: var(--font-sans); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;"><i class="fa-solid fa-list-check"></i> Action Items:</strong>
                                    <ul style="margin: 0.4rem 0 0 1.2rem; padding: 0;">
                                        ${data.meeting.action_items.map(a => `<li style="margin-bottom: 4px;">${a}</li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}
                        </div>
                        <div style="margin-top: 1.2rem; padding-top: 0.8rem; border-top: 1px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                            <div style="display: flex; gap: 1rem; align-items: center;">
                                <button class="btn-icon-link" onclick="copyLatestMeetingMarkdown()">
                                    <i class="fa-regular fa-copy"></i> Copy Markdown
                                </button>
                                <button class="btn-icon-link" onclick="shareMeetingToX('${data.meeting.date}')">
                                    <i class="fa-brands fa-x-twitter"></i> Share Summary to X
                                </button>
                            </div>
                            <a href="meetings.html" class="meeting-archive-link">
                                Meeting Archive →
                            </a>
                        </div>
                    </div>
                `;
            }

            // 3. Research & Governance
            if (data.discussions && data.discussions.length > 0) {
                html += `<h2>🗣️ Protocol R&D & Discussions</h2>`;
                data.discussions.forEach(thread => {
                    const hasTech = thread.technical_summary && thread.technical_summary.length > 0;
                    html += `
                        <div class="pr-item ${hasTech ? 'has-tech' : ''}" ${hasTech ? `onclick="if(event.target.tagName !== 'A' && event.target.closest('a') === null) this.classList.toggle('expanded')"` : ''}>
                            ${hasTech ? `<i class="fa-solid fa-chevron-down expand-icon"></i>` : ''}
                            <div class="pr-meta">
                                <strong>${thread.source}</strong> 
                                ${thread.author ? `· by ${formatUser(thread.author, thread.source ? thread.source.toLowerCase() : null)}` : ''} 
                                · ${thread.message_count} messages
                            </div>
                            <div class="pr-title"><a href="${thread.link}" target="_blank">${thread.subject}</a></div>
                            ${thread.summary ? `<div class="pr-summary">${thread.summary}</div>` : ''}
                            ${hasTech ? `<div class="pr-technical-summary">${thread.technical_summary}</div>` : ''}
                        </div>
                    `;
                });
            }

            // 4. Merged PRs
            if (data.categories.merged && data.categories.merged.length > 0) {
                html += `
                    <h2>🚢 Merged Code</h2>
                    <div class="filter-pills" style="margin-bottom: 1.5rem;" id="merged-category-filters">
                        <button class="filter-pill active" onclick="filterMergedCategory('all', this)">All Categories</button>
                        <button class="filter-pill" onclick="filterMergedCategory('Security & Consensus', this)">Consensus</button>
                        <button class="filter-pill" onclick="filterMergedCategory('Performance & Optimization', this)">Performance</button>
                        <button class="filter-pill" onclick="filterMergedCategory('Network & Privacy', this)">P2P & Network</button>
                        <button class="filter-pill" onclick="filterMergedCategory('Wallet & User Tools', this)">Wallet & Tools</button>
                        <button class="filter-pill" onclick="filterMergedCategory('Maintenance & Tech Debt', this)">Maintenance</button>
                    </div>
                `;

                let allMergedPrs = [];
                data.categories.merged.forEach(cat => {
                    cat.prs.forEach(pr => {
                        pr.category_name = cat.name;
                        allMergedPrs.push(pr);
                    });
                });

                allMergedPrs.sort((a, b) => (b.importance || 0) - (a.importance || 0));

                let visibleCount = 0;
                let hiddenCount = 0;
                let mergedHtml = "";

                allMergedPrs.forEach(pr => {
                    const shouldShow = visibleCount < 10;
                    if (!shouldShow) {
                        hiddenCount++;
                    } else {
                        visibleCount++;
                    }

                    const hasTech = pr.technical_summary && pr.technical_summary.length > 0;
                    mergedHtml += `
                        <div class="pr-item merged-pr-item ${shouldShow ? '' : 'hidden-pr'} ${hasTech ? 'has-tech' : ''}" data-category="${pr.category_name}" style="${shouldShow ? '' : 'display: none;'}" ${hasTech ? `onclick="if(event.target.tagName !== 'A' && event.target.closest('a') === null) this.classList.toggle('expanded')"` : ''}>
                            ${hasTech ? `<i class="fa-solid fa-chevron-down expand-icon"></i>` : ''}
                            <div class="pr-meta">
                                <a href="https://github.com/bitcoin/bitcoin/pull/${pr.number}" target="_blank">#${pr.number}</a>
                                by ${formatUser(pr.author)}
                                <span class="category-badge">${pr.category_name}</span>
                                ${pr.review_count ? `<span style="margin-left: 8px;">• ${pr.review_count} review comments</span>` : ''}
                            </div>
                            <div class="pr-title"><a href="https://github.com/bitcoin/bitcoin/pull/${pr.number}" target="_blank">${pr.title}</a></div>
                            ${pr.summary ? `<div class="pr-summary">${pr.summary}</div>` : ''}
                            ${hasTech ? `<div class="pr-technical-summary">${pr.technical_summary}</div>` : ''}
                        </div>
                    `;
                });

                html += `<div class="category-block" id="merged-prs-block">` + mergedHtml + `</div>`;

                if (hiddenCount > 0) {
                    html += `
                        <div style="text-align: center; margin-top: 20px;" id="toggle-prs-container">
                            <button id="toggle-prs-btn" data-count="${hiddenCount}" style="padding: 10px 20px; background-color: var(--accent-color); color: white; border: none; border-radius: 4px; cursor: pointer; font-family: var(--font-sans); font-weight: 600;" onclick="togglePrs()">Show ${hiddenCount} More PRs</button>
                        </div>
                    `;
                }
            }

            // 5. Hot PRs
            if (data.categories.hot && data.categories.hot.length > 0) {
                html += `<h2>🔥 Active Code Under Review</h2>`;

                let allHotPrs = [];
                data.categories.hot.forEach(cat => {
                    cat.prs.forEach(pr => {
                        pr.category_name = cat.name;
                        allHotPrs.push(pr);
                    });
                });

                allHotPrs.sort((a, b) => (b.event_count || 0) - (a.event_count || 0));

                let hotHtml = "";
                allHotPrs.slice(0, 10).forEach(pr => {
                    const hasTech = pr.technical_summary && pr.technical_summary.length > 0;
                    hotHtml += `
                        <div class="pr-item ${hasTech ? 'has-tech' : ''}" ${hasTech ? `onclick="if(event.target.tagName !== 'A' && event.target.closest('a') === null) this.classList.toggle('expanded')"` : ''}>
                            ${hasTech ? `<i class="fa-solid fa-chevron-down expand-icon"></i>` : ''}
                            <div class="pr-meta">
                                <a href="https://github.com/bitcoin/bitcoin/pull/${pr.number}" target="_blank">#${pr.number}</a>
                                ${pr.author ? `by ${formatUser(pr.author)}` : ''}
                                <span class="category-badge">${pr.category_name}</span>
                                <span style="margin-left: 8px;">• ${pr.event_count} review comments</span>
                            </div>
                            <div class="pr-title"><a href="https://github.com/bitcoin/bitcoin/pull/${pr.number}" target="_blank">${pr.title}</a></div>
                            ${pr.summary ? `<div class="pr-summary">${pr.summary}</div>` : ''}
                            ${hasTech ? `<div class="pr-technical-summary">${pr.technical_summary}</div>` : ''}
                        </div>
                    `;
                });

                html += `<div class="category-block">` + hotHtml + `</div>`;
            }

            // 6. Contributor Spotlight
            html += `<h2>🏆 Contributor Spotlight</h2>`;
            html += `<div class="contributor-spotlight-block">`;

            if (data.shoutouts && data.shoutouts.new_contributors && data.shoutouts.new_contributors.length > 0) {
                html += `
                    <div class="first-time-contributors-card">
                        <div class="first-time-header">
                            <span class="first-time-title-badge"><i class="fa-solid fa-award"></i> Welcome First-Time Contributors</span>
                            <span class="first-time-subtitle">New developers merged into Bitcoin Core this week</span>
                        </div>
                        <div class="first-time-names">
                            ${data.shoutouts.new_contributors.map(u => formatUser(u)).join('')}
                        </div>
                    </div>
                `;
            }

            // Demoted Maintainers & Reviewers Footnote
            let maintainerItems = [];
            if (data.shoutouts && data.shoutouts.top_reviewers) {
                data.shoutouts.top_reviewers.slice(0, 5).forEach(r => {
                    maintainerItems.push(`${formatUser(r.user)} (${r.count} reviews)`);
                });
            }
            if (data.shoutouts && data.shoutouts.top_authors) {
                data.shoutouts.top_authors.slice(0, 3).forEach(a => {
                    maintainerItems.push(`${formatUser(a.user)} (${a.count} merges)`);
                });
            }

            if (maintainerItems.length > 0) {
                html += `
                    <div class="maintainer-footnote">
                        <strong class="maintainer-label">Active Maintainers & Key Reviewers:</strong>
                        <span class="maintainer-list">${maintainerItems.join(' · ')}</span>
                    </div>
                `;
            }

            html += `</div>`;

            content.innerHTML = html;
            window.scrollTo(0, 0); // Scroll to top when loading new edition
        }

        function shareMeetingToX(dateStr) {
            const baseUrl = window.location.origin + window.location.pathname.replace('index.html', '').replace(/\/$/, '/') + 'meetings.html';
            const permalink = `${baseUrl}?date=${dateStr}`;
            const text = `Bitcoin Core Meeting (${dateStr}): Weekly protocol meeting recap.\n\nRead the summary on @BitcoinDataLabs:`;
            const shareUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(permalink)}`;
            window.open(shareUrl, '_blank', 'noopener,noreferrer');
        }

        let currentMeetingData = null;

        function copyLatestMeetingMarkdown() {
            if (!currentMeetingData || !currentMeetingData.meeting) return;
            const m = currentMeetingData.meeting;

            let md = `### 🗓️ Bitcoin Core Meeting Summary — ${m.date}\n`;
            if (m.participant_count) md += `**Participants:** ${m.participant_count} · **IRC Channel:** #bitcoin-core-dev\n\n`;

            if (m.topics_discussed && m.topics_discussed.length > 0) {
                md += `**Topics Discussed:**\n`;
                m.topics_discussed.forEach(t => md += `- ${t}\n`);
                md += `\n`;
            }

            if (m.action_items && m.action_items.length > 0) {
                md += `**Action Items:**\n`;
                m.action_items.forEach(a => md += `- ${a}\n`);
                md += `\n`;
            }

            md += `*Source: https://twib.bitcoindatalabs.org/meetings.html?date=${m.date}*`;

            navigator.clipboard.writeText(md).then(() => {
                showToast('Meeting summary copied as Markdown!');
            });
        }

        function showToast(message) {
            let toast = document.getElementById('twib-toast');
            if (!toast) return;
            toast.innerHTML = `<i class="fa-solid fa-circle-check" style="color: #48bb78;"></i> ${message}`;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Initialize
        loadArchiveIndex();
        fetchNewsletter();
    </script>
    <div id="twib-toast" class="twib-toast"></div>
</body>

</html>
