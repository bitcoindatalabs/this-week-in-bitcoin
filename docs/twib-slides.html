<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>TWIB social slides | Bitcoin Data Labs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">

    <!-- Shared slide kit + TWIB palette: generated by python/automation/jobs/orange_dev/twib_slides.py -->
    <link rel="stylesheet" href="styles/slide-kit.generated.css">
    <link rel="stylesheet" href="styles/palette-twib.generated.css">
    <link rel="stylesheet" href="styles/twib-slides.css">
</head>

<!--
    Headless capture canvas for the TWIB weekly family (1200x800 slides, light "twib" theme):
      ?snapshot=weekly_YYYYMMDD   -> 3 weekly slides
      ?snapshot=meeting_YYYYMMDD  -> 1 dev meeting slide
    Snapshots are written to data/slides/ by twib_slides.py.
-->
<body class="reports-body report-theme theme-twib" data-loaded="false">
    <main class="slides-container">
        <section class="report-slide slide-1"></section>
        <section class="report-slide slide-2"></section>
        <section class="report-slide slide-3"></section>
    </main>

    <script src="scripts/slide-kit.generated.js"></script>
    <script src="scripts/twib-slides.js"></script>
</body>

</html>
